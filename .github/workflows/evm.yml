name: EVM SDK

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck:integration
      - run: python3 ../scripts/test-typescript-package.py

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: evm
      - run: python3 scripts/sync-abis.py --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo package -p swig-evm --locked

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evm/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv sync --locked
      - run: python3 ../scripts/sync-abis.py --check
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv build
      - run: uv run --isolated --no-project --with ./dist/swig_evm-0.1.0-py3-none-any.whl python -c 'from web3 import Web3; from swig_evm import get_contract; assert get_contract(Web3(), "SwigConfig", "0x1111111111111111111111111111111111111111").functions.entryPoint'
