[package]
name = "swig-evm-integration"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
swig-evm = { path = "../../rust" }
alloy = { version = "2.4.2", features = ["signer-mnemonic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempo-alloy = "=1.8.1"
